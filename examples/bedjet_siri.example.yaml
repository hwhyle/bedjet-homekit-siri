# Generated by scripts/generate_config.py — review, then copy into
# Home Assistant as a package (see README) or install with
# scripts/install_ha_scripts.py.
#
# Side        : My Side
# Fan name    : My BedJet
# Climate     : climate.bedjet_proxy_my_bedjet
# Fan entity  : fan.bedjet_proxy_my_bedjet
# Heat / Cool : 90 / 66°F
# Fan speed   : 40%

script:
  heat_my_side:
    alias: Heat My Side
    icon: mdi:heat-wave
    mode: restart
    description: "Set My BedJet to heat at 90°F with fan at 40%."
    sequence:
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.bedjet_proxy_my_bedjet
        data:
          hvac_mode: heat
      - action: climate.set_temperature
        target:
          entity_id: climate.bedjet_proxy_my_bedjet
        data:
          temperature: 90
      - action: climate.set_fan_mode
        target:
          entity_id: climate.bedjet_proxy_my_bedjet
        data:
          fan_mode: "40%"
      - action: fan.set_percentage
        target:
          entity_id: fan.bedjet_proxy_my_bedjet
        data:
          percentage: 40

  cool_my_side:
    alias: Cool My Side
    icon: mdi:snowflake
    mode: restart
    description: "Set My BedJet to cool (fan_only) at the lowest temp (66°F) with fan at 40%."
    sequence:
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.bedjet_proxy_my_bedjet
        data:
          hvac_mode: fan_only
      - action: climate.set_temperature
        target:
          entity_id: climate.bedjet_proxy_my_bedjet
        data:
          temperature: 66
        continue_on_error: true
      - action: climate.set_fan_mode
        target:
          entity_id: climate.bedjet_proxy_my_bedjet
        data:
          fan_mode: "40%"
      - action: fan.set_percentage
        target:
          entity_id: fan.bedjet_proxy_my_bedjet
        data:
          percentage: 40
